# ==================
# Project Details
# ==================
name: "SQL_DatabricksSharedBasic"
config-version: 2
require-dbt-version:
- ">=1.0.0"
- "<2.0.0"
version: "0.1"
profile: "prophecy-default"

# ==================
# File Path Configs
# ==================
clean-targets:
- "target"
- "dbt_modules"
- "logs"
seed-paths:
- "seeds"
model-paths:
- "models"
- "prophecy-sources"
macro-paths:
- "macros"
target-path: "target"

# ==================
# Variable Configs
# ==================
vars:
  PROJECT_ALIAS_CHILD: "env_uitesting_shared_child_model_1"
  PROJECT_DATABASE: "hive_metastore"
  PROJECT_SCHEMA: "qa_schema"
  PROJECT_SCHEMA_DB_WAREHOUSE: "qa_db_warehouse"
  qa_config: "qa"
  qa_schema: "qa_schema"
  schema_qa_db_warehouse: "qa_db_warehouse"
  v_project_dict: "{'a': 2, 'b': 'hello'}"
  v_project_int: "20"
  v_project_int_real: 20
  v_project_string_real: "projectstring"

# ============
# Misc
# ============
dispatch: []
